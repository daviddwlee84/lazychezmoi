version: 2
project_name: lazychezmoi
before:
  hooks:
    - python3 scripts/release.py completions --project lazychezmoi --binary lazychezmoi --main .
builds:
  - id: lazychezmoi
    main: .
    binary: lazychezmoi
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Tag }}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
checksum:
  name_template: checksums.txt
release:
  draft: true
