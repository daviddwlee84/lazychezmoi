name: Windows distribution
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TERM: xterm-256color
      NO_COLOR: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./internal/scoopupgrade
      - name: Real Scoop ownership and process-exit handoff
        run: python scripts/windows_scoop_smoke.py --project lazychezmoi --binary lazychezmoi --main .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-scoop-lazychezmoi
          path: build/windows-scoop-smoke.json
          if-no-files-found: warn
