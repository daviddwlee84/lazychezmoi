name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture backend
        run: python scripts/install_fixture_chezmoi.py --directory "${{ runner.temp }}/chezmoi-fixture"
      - name: Install diff and search test tools (Linux/Windows)
        if: runner.os != 'macOS'
        run: python scripts/install_ci_tools.py
      - name: Install diff and search test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep git-delta
      - name: Install Unix test shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install ConPTY harness
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.2
      - name: Install terminal screen assertions
        run: python -m pip install pyte==0.8.2
      - name: Verify terminal screen scrolling model
        run: python -m unittest discover -s scripts -p test_terminal_screen.py
      - name: Static analysis
        run: go vet ./...
      - name: Tests and races
        run: go test -race ./...
      - name: Build
        run: go build -o build/ ./...
      - name: Terminal acceptance (Unix)
        if: runner.os != 'Windows'
        run: python scripts/pty_smoke.py build/lazychezmoi
      - name: Terminal acceptance (Windows)
        if: runner.os == 'Windows'
        run: python scripts/pty_smoke.py build/lazychezmoi.exe
      - name: Mouse, hunk and search acceptance (Unix)
        if: runner.os != 'Windows'
        run: python scripts/pty_features.py build/lazychezmoi
      - name: Mouse, hunk and search acceptance (Windows)
        if: runner.os == 'Windows'
        run: python scripts/pty_features.py build/lazychezmoi.exe

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release verification and immutable publication
        run: python3 -m unittest discover -s scripts -p "test_*release*.py"
      - name: Test fixed upstream fixture verification
        run: python3 -m unittest discover -s scripts -p "test_install_fixture_chezmoi.py"
      - name: Test independent distribution boundaries
        if: hashFiles('scripts/check-distribution.py') != ''
        run: python3 -m unittest discover -s scripts -p test_distribution.py
      - name: Build real source archive and Go module ZIP
        if: hashFiles('scripts/check-distribution.py') != ''
        run: python3 scripts/check-distribution.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: Verify four platform archives and native startup
        run: python3 scripts/release.py check --project lazychezmoi --binary lazychezmoi --smoke
