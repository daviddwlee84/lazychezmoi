name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable stable tag on main
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Load publisher from the tested workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git show "${WORKFLOW_SHA}:scripts/release.py" > "$RUNNER_TEMP/release-publisher.py"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean --skip=publish,announce
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify payloads and native binary
        run: python3 "$RUNNER_TEMP/release-publisher.py" check --project lazychezmoi --binary lazychezmoi --tag "$RELEASE_TAG" --smoke
      - name: Publish only a complete, verified release
        run: python3 "$RUNNER_TEMP/release-publisher.py" publish --project lazychezmoi --binary lazychezmoi --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
